<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurio — Marketplace de NFTs</title>
    <meta name="description" content="Kurio: descubra, colecione e compre NFTs de criadores emergentes e consagrados. Demonstração com dados simulados." />
    <meta name="theme-color" content="#140d0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Arte do destaque (LCP): baixa em paralelo enquanto o app inicia. Mesmo srcset/sizes da <img> do
         destaque (src/lib/art.ts, ART_SIZES.hero), então o navegador escolhe o mesmo arquivo nos dois. -->
    <link
      rel="preload"
      as="image"
      href="/nfts/emerald.webp"
      imagesrcset="/nfts/emerald-320.webp 320w, /nfts/emerald.webp 640w, /nfts/emerald-960.webp 960w, /nfts/emerald-1254.webp 1254w"
      imagesizes="(min-width: 1921px) 630px, (min-width: 1441px) calc((100vw - 240px) * 0.375), (min-width: 768px) 450px, 138px"
      type="image/webp"
      fetchpriority="high"
    />
    <style>
      html,body{background:#140d0a;color:#f5f1eb;margin:0}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
